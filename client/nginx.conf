server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Messagerie temps reel. Socket.io ecoute a la racine de l'API, pas sous
  # /api/ : sans ce bloc, le salon ne fonctionne qu'en developpement.
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Une connexion WebSocket reste ouverte : le delai par defaut la couperait.
    proxy_read_timeout 1h;
  }

  # SPA : toutes les routes inconnues renvoient index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
