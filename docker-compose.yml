# SUPMEAL — orchestration des 3 services (cf. sujet 2.3.2)
# Lancement complet : `docker compose up --build`

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applique les migrations
  migrate:
    image: supmeal-api:latest
    build: ./server
    command: ["node", "dist/db/migrate.js", "up"]
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: supmeal-api:latest
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${API_PORT:-4000}:4000"

  # Remplit une base neuve d'un jeu de données plausible, par l'API publique.
  seed:
    image: supmeal-api:latest
    build: ./server
    command: ["node", "scripts/seed/seed.mjs"]
    restart: "no"
    env_file: .env
    environment:
      API_URL: http://api:4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        # En Docker, le client appelle l'API via le proxy Nginx (même origine).
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
  uploads_data:
