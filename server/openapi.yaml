openapi: 3.0.3
info:
  title: SUPMEAL API
  version: 1.0.0
  description: >
    API REST de SUPMEAL — gestion de recettes, cookbooks partagés, planification de
    repas, messagerie et commentaires. Conception design-first : ce contrat précède
    l'implémentation. Authentification par JWT Bearer.
servers:
  - url: /api/v1
    description: Base path

tags:
  - name: Auth
  - name: Users
  - name: Recipes
  - name: Discovery
  - name: Comments
  - name: Reviews
  - name: Cookbooks
  - name: CookbookRecipes
  - name: Members
  - name: Invitations
  - name: Messages
  - name: MealPlan
  - name: ShoppingLists
  - name: Catalog
  - name: ImportExport

security:
  - bearerAuth: []

paths:
  # ----------------------------- Auth -----------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription par compte local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion locale
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renouvelle l'access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalide le refresh token
      responses:
        '204': { description: Déconnecté }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/oauth/{provider}:
    get:
      tags: [Auth]
      summary: Démarre le flux OAuth2
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '302': { description: Redirection vers le fournisseur }
  /auth/oauth/{provider}/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth2 (échange code, puis redirige vers le front)
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
      responses:
        '302':
          description: >-
            Redirection vers le front (CLIENT_ORIGIN/oauth/callback) avec les
            tokens dans le fragment (#accessToken=...&refreshToken=...), ou
            #error=... en cas d'échec.
  /auth/me:
    get:
      tags: [Auth]
      summary: Utilisateur courant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------- Users -----------------------------
  /users/me:
    get:
      tags: [Users]
      summary: Profil courant
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [Users]
      summary: Modifier le profil
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                avatarUrl: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /users/me/password:
    put:
      tags: [Users]
      summary: Changer le mot de passe
      description: >
        Remplacement intégral de la ressource, d'où PUT et non PATCH : le corps
        n'est pas une représentation partielle (`currentPassword` est une preuve
        d'identité, pas un champ modifiable). `currentPassword` est obligatoire
        dès qu'un mot de passe existe ; un compte purement OAuth2 s'en définit
        un premier sans le fournir. Toutes les sessions ouvertes sont révoquées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Modifié }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/preferences:
    get:
      tags: [Users]
      summary: Préférences culinaires
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferences' } } } }
    put:
      tags: [Users]
      summary: Définir les préférences culinaires
      description: >
        Remplacement complet : tout champ omis reprend sa valeur par défaut
        (tableau vide, 2 portions).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferences' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferences' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /users/me/data:
    get:
      tags: [Users]
      summary: Exporter ses données personnelles (portabilité)
      description: >
        Distinct de `/export`, qui produit du contenu réimportable : ce fichier
        décrit la personne et ne se réimporte pas. JSON seul. Il ne contient
        aucun secret (ni hash de mot de passe, ni jeton) et rien qui appartienne
        à autrui : commentaires, messages et avis sont ceux de l'utilisateur,
        les cookbooks n'y figurent que par sa propre adhésion. Les recettes y
        sont listées en référence, leur contenu s'obtenant par `/export`.
      responses:
        '200':
          description: Fichier de données personnelles
          headers:
            Content-Disposition:
              description: 'attachment; filename="supmeal-donnees-AAAA-MM-JJ.json"'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalDataFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me/oauth:
    get:
      tags: [Users]
      summary: Comptes OAuth2 liés
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OAuthAccount' } }
  /users/me/oauth/{provider}:
    post:
      tags: [Users]
      summary: Lier un compte OAuth2
      description: >
        Renvoie l'URL d'autorisation à ouvrir dans le navigateur. Pas de 302 :
        la requête est authentifiée par en-tête, ce qu'une navigation vers le
        fournisseur ne permet pas. Le `state` signé porte l'utilisateur cible.
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Fournisseur non configuré }
    delete:
      tags: [Users]
      summary: Délier un compte OAuth2
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      responses:
        '204': { description: Délié }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Dernier moyen de connexion, déliaison refusée" }

  # ----------------------------- Recipes -----------------------------
  /recipes:
    get:
      tags: [Recipes]
      summary: Liste, recherche plein texte et filtrage des recettes
      description: >
        Les entrées renvoyées sont des résumés : elles portent les tags mais ni
        `ingredients` ni `steps`, qu'une liste n'exploite pas et dont le
        chargement multiplierait les lignes jointes. Le détail complet s'obtient
        par `GET /recipes/{id}`.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: >
            Recherche plein texte française sur le titre (poids A), la
            description (B) et les noms d'ingrédients (C).
        - { in: query, name: cookbookId, schema: { type: string, format: uuid } }
        - in: query
          name: tags
          schema: { type: string }
          description: >
            CSV de tags, insensible à la casse. Plusieurs valeurs se cumulent
            en ET : `tags=dessert,facile` rend les recettes qui sont les deux.
        - in: query
          name: ingredients
          schema: { type: string }
          description: >
            CSV d'ingrédients, cumulés en ET — la question posée étant « qu'est-ce
            que je peux faire avec ce que j'ai ».
        - in: query
          name: maxPrep
          schema: { type: integer }
          description: Exclut les recettes dont le temps n'est pas renseigné.
        - in: query
          name: maxCook
          schema: { type: integer }
          description: Exclut les recettes dont le temps n'est pas renseigné.
        - { in: query, name: favorite, schema: { type: boolean } }
        - in: query
          name: sort
          schema: { type: string, enum: [relevance, recent, prepTime] }
          description: >
            Défaut : `relevance` si `q` est fourni, `recent` sinon. `prepTime`
            classe par temps croissant, les recettes sans temps en dernier.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipePage' }
    post:
      tags: [Recipes]
      summary: Créer une recette personnelle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeInput' }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
  /recipes/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Recipes]
      summary: Détail d'une recette
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Recipes]
      summary: Modifier une recette (créateur ou Éditeur+ d'un cookbook la contenant)
      description: >
        Les champs simples suivent la sémantique PATCH : absent = inchangé.
        Les collections (`ingredients`, `steps`, `tags`) sont remplacées
        intégralement lorsqu'elles sont présentes, et conservées lorsqu'elles
        sont absentes — le client décrit l'état final voulu plutôt qu'un diff.
        Un tableau vide efface donc la collection. L'écriture est transactionnelle.
        `visibility` fait exception à l'ouverture aux éditeurs : seul le
        créateur bascule sa recette en `public` (403 sinon).
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/RecipeInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Recipes]
      summary: Supprimer la recette (créateur uniquement)
      responses:
        '204': { description: Supprimé }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recipes/{id}/image:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Recipes]
      summary: Uploader l'image de la recette
      description: >
        JPEG, PNG ou WebP, 5 Mo au maximum. Le nom du fichier stocké est généré
        par le serveur, jamais repris du client. Envoyer une nouvelle image
        remplace la précédente et supprime son fichier. `imageUrl` est rendue
        absolue en réponse mais stockée en relatif.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { description: Identifiant invalide, fichier manquant ou format non supporté }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Image trop volumineuse }
  /recipes/suggestions:
    get:
      tags: [Recipes]
      summary: Suggestions de recettes (bonus)
      description: >
        Propositions tirées du vivier accessible à l'utilisateur — ses recettes et
        celles de ses cookbooks. On ne suggère jamais ce qui n'est pas lisible : une
        suggestion menant à un 403 serait pire que pas de suggestion.

        Sont écartées les recettes contenant un ingrédient rappelant une allergie
        déclarée, celles déjà mises en favori et celles déjà prévues au planning à
        venir. Le reste est classé par un score explicable : régime déclaré (3),
        cuisine préférée (2), puis proximité avec ce que l'utilisateur cuisine déjà,
        plafonnée par tag. Chaque suggestion porte les motifs qui l'ont fait
        remonter.

        Déclarée avant `/recipes/{id}` : la route paramétrée capterait sinon
        « suggestions » comme un identifiant.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    recipe:
                      description: Résumé, sans `ingredients` ni `steps`.
                      allOf: [ { $ref: '#/components/schemas/Recipe' } ]
                    score: { type: integer }
                    reasons:
                      description: Motifs en clair, à afficher avec la suggestion.
                      type: array
                      items: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /recipes/{id}/export:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [ImportExport]
      summary: Exporter une seule recette
      description: >
        Même enveloppe que `/export`, réduite à une recette (`cookbooks` vide),
        dans les trois mêmes formats. Le fichier obtenu se réimporte par `/import`
        sans traitement particulier. On n'exporte que ce qu'on a le droit de lire.
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv, mealie], default: json }
      responses:
        '200':
          description: Fichier d'export
          headers:
            Content-Disposition:
              description: 'attachment; filename="supmeal-<titre>-AAAA-MM-JJ.<ext>"'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportFile' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /recipes/{id}/favorite:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    post:
      tags: [Recipes]
      summary: Marquer comme favori
      description: Idempotent — marquer deux fois reste un succès.
      responses:
        '204': { description: Ajouté aux favoris }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Recipes]
      summary: Retirer des favoris
      description: >
        Idempotent, et sans contrôle d'accès à la recette : perdre l'accès à
        une recette ne doit pas empêcher de la retirer de ses propres favoris.
      responses:
        '204': { description: Retiré }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------- Comments (privés au cookbook) -----------------------------
  /cookbooks/{id}/recipes/{recipeId}/comments:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { in: path, name: recipeId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Comments]
      summary: Lister le fil de commentaires (privé au cookbook, READER+)
      description: >
        Fil du couple (recette, cookbook), dans l'ordre de la conversation. La
        recette doit être liée au cookbook, sans quoi le fil n'existe pas (404).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Comment' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      summary: Commenter (COMMENTER+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string } } }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /comments/{commentId}:
    parameters: [ { in: path, name: commentId, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [Comments]
      summary: Modifier son commentaire (auteur seul)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Comments]
      summary: Supprimer (auteur ou OWNER du cookbook)
      responses:
        '204': { description: Supprimé }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------- Reviews (avis publics) -----------------------------
  /recipes/{id}/reviews:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Reviews]
      summary: Lister les avis et la note moyenne
      description: Lecture anonyme si la recette est `public`, du plus récent au plus ancien.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  avgRating:
                    type: number
                    nullable: true
                    description: "`null` sans avis : non notée n'est pas notée zéro."
                  reviewCount: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reviews]
      summary: Créer ou mettre à jour son avis (1 par utilisateur)
      description: >
        Un avis par couple (recette, utilisateur) : le même appel dépose ou
        remplace le sien. Le créateur ne note pas sa propre recette.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reviews]
      summary: Supprimer son avis
      responses:
        '204': { description: Supprimé }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Aucun avis de cet utilisateur sur cette recette }

  # ----------------------------- Discovery (public) -----------------------------
  /discover/recipes:
    get:
      tags: [Discovery]
      summary: Rechercher les recettes publiques
      description: >
        Catalogue des recettes `public`, ouvert aux visiteurs. Un jeton reste
        accepté : il renseigne alors `isFavorite`, sans élargir le périmètre.
        Ni `cookbookId` ni `favorite` : ils désignent le périmètre d'un compte.
        `ingredients` non plus : le filtre par ingrédient reste réservé à la
        liste personnelle, où il répond à « qu'est-ce que je peux faire avec ce
        que j'ai ».
      security: []
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: tags, description: Liste séparée par des virgules., schema: { type: string } }
        - { in: query, name: maxPrep, description: Temps de préparation maximal (min). Exclut les recettes sans temps renseigné., schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { in: query, name: maxCook, description: Temps de cuisson maximal (min). Exclut les recettes sans temps renseigné., schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, rating, recent] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /discover/recipes/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Discovery]
      summary: Détail public d'une recette publique
      description: >
        Une recette non publique répond **404**, comme une recette inexistante :
        la route est anonyme et adressable par n'importe quel identifiant, un 403
        confirmerait son existence. Le créateur la consulte par `/recipes/{id}`.
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------- Cookbooks -----------------------------
  /cookbooks:
    get:
      tags: [Cookbooks]
      summary: Lister mes cookbooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Cookbook' } }
    post:
      tags: [Cookbooks]
      summary: Créer un cookbook (créateur = OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string }, description: { type: string } }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/Cookbook' } } } }
  /cookbooks/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Cookbooks]
      summary: Détail d'un cookbook (membre requis)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cookbook' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Cookbooks]
      summary: Modifier le cookbook (OWNER)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, description: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cookbook' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Cookbooks]
      summary: Supprimer le cookbook (OWNER) — n'efface pas les recettes
      responses:
        '204': { description: Supprimé }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cookbooks/{id}/export:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [ImportExport]
      summary: Exporter un cookbook et ses recettes
      description: >
        Même enveloppe que `/export`, réduite aux recettes du cookbook et à sa
        composition. Sans les préférences culinaires de l'exportateur : on partage
        un livre de recettes, pas un profil. Ouvert au Lecteur, qui peut déjà tout
        y consulter ; le périmètre d'accès continue de s'appliquer aux recettes.
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv, mealie], default: json }
      responses:
        '200':
          description: Fichier d'export
          headers:
            Content-Disposition:
              description: 'attachment; filename="supmeal-<nom-du-cookbook>-AAAA-MM-JJ.<ext>"'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportFile' }
            text/csv:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /cookbooks/{id}/recipes:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [CookbookRecipes]
      summary: Recettes du cookbook + recherche propre
      description: >
        Mêmes critères que `GET /recipes`, restreints au cookbook : le
        paramètre `cookbookId` n'a donc pas cours ici, le cookbook étant déjà
        désigné par l'URL. Réponse paginée, entrées résumées.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: tags, schema: { type: string }, description: CSV cumulé en ET }
        - { in: query, name: ingredients, schema: { type: string }, description: CSV cumulé en ET }
        - { in: query, name: maxPrep, schema: { type: integer } }
        - { in: query, name: maxCook, schema: { type: integer } }
        - { in: query, name: favorite, schema: { type: boolean } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, recent, prepTime] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Recipe' } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
    post:
      tags: [CookbookRecipes]
      summary: Créer une recette directement dans le cookbook (EDITOR+)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecipeInput' } } }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cookbooks/{id}/recipes/{recipeId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { in: path, name: recipeId, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [CookbookRecipes]
      summary: Lier une recette existante au cookbook (EDITOR+)
      responses:
        '204': { description: Liée }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [CookbookRecipes]
      summary: Retirer la recette du cookbook (supprime la liaison, pas la recette)
      responses:
        '204': { description: Liaison supprimée }
        '403': { $ref: '#/components/responses/Forbidden' }

  /cookbooks/{id}/members:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Members]
      summary: Lister les membres et leurs rôles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Membership' } }
  /cookbooks/{id}/members/me:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    delete:
      tags: [Members]
      summary: Quitter le cookbook (tout membre)
      description: >
        Supprime sa propre appartenance. Refusé au dernier `OWNER` : il doit
        d'abord promouvoir un successeur, sans quoi le cookbook resterait sans
        personne pour l'administrer.
      responses:
        '204': { description: Départ enregistré }
        '409': { $ref: '#/components/responses/Conflict' }
  /cookbooks/{id}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Members]
      summary: Changer le rôle d'un membre (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/Role' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Members]
      summary: Retirer un membre (OWNER)
      responses:
        '204': { description: Retiré }
        '409': { $ref: '#/components/responses/Conflict' }

  /cookbooks/{id}/invitations:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Invitations]
      summary: Lister les invitations (OWNER)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
    post:
      tags: [Invitations]
      summary: Inviter un membre (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: >
            Créé. Seule réponse à porter le `token` en clair et le lien
            d'acceptation : le token n'est stocké que haché.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cookbooks/{id}/invitations/{invId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { in: path, name: invId, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Invitations]
      summary: Révoquer une invitation (OWNER)
      responses: { '204': { description: Révoquée } }
  /invitations/{token}/accept:
    parameters: [ { in: path, name: token, required: true, schema: { type: string } } ]
    post:
      tags: [Invitations]
      summary: Accepter une invitation
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Membership' } } } } }
  /invitations/{token}/decline:
    parameters: [ { in: path, name: token, required: true, schema: { type: string } } ]
    post:
      tags: [Invitations]
      summary: Refuser une invitation
      responses: { '204': { description: Refusée } }

  /cookbooks/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [Messages]
      summary: Historique du chat (COMMENTER+)
      description: >-
        La page 1 porte les messages les plus récents ; chaque page est rendue
        dans l'ordre de lecture (du plus ancien au plus récent).
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Messages]
      summary: Envoyer un message (fallback REST, COMMENTER+)
      description: >-
        Le message est aussi diffusé dans le salon WebSocket du cookbook
        (`message:new`), pour les clients déjà connectés.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------- Meal plan -----------------------------
  /meal-plan:
    get:
      tags: [MealPlan]
      summary: Entrées du planning (personnel ou de groupe)
      description: >-
        Sans `cookbookId`, le planning personnel de l'appelant ; avec, celui du
        cookbook (READER+), toutes personnes confondues. Les bornes `from` et
        `to` sont facultatives et incluses ; une fenêtre inversée est refusée.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: cookbookId, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MealPlanEntry' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [MealPlan]
      summary: Ajouter une entrée (EDITOR+ si cookbook)
      description: >-
        La recette doit être accessible à l'appelant : créateur, membre d'un
        cookbook la contenant, ou recette publique.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MealPlanEntryInput' } } }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/MealPlanEntry' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meal-plan/{entryId}:
    parameters: [ { in: path, name: entryId, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [MealPlan]
      summary: Modifier une entrée (auteur, ou EDITOR du cookbook)
      description: >-
        `cookbookId` n'est pas modifiable et toute clé inconnue est refusée
        (400) : une entrée ne passe pas d'un planning personnel à celui d'un
        groupe, sous peine de changer les droits qui l'encadrent.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/MealPlanEntryUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MealPlanEntry' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [MealPlan]
      summary: Supprimer une entrée (auteur, ou EDITOR du cookbook)
      responses:
        '204': { description: Supprimé }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------- Shopping lists -----------------------------
  /shopping-lists:
    get:
      tags: [ShoppingLists]
      summary: Mes listes de courses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ShoppingList' } }
    post:
      tags: [ShoppingLists]
      summary: Générer une liste depuis le planning (EDITOR+ si cookbook)
      description: >
        Agrège les ingrédients de tous les repas planifiés sur la période. Deux lignes
        ne se cumulent que si elles portent le même ingrédient dans la même unité :
        « 2 pommes » et « 200 g de pommes » restent séparés, faute de table de
        conversion. Un ingrédient sans quantité — le sel — le reste. Les quantités
        sont mises à l'échelle quand l'entrée de planning et la recette précisent
        toutes deux leurs portions.

        La liste est un instantané : ses lignes sont écrites à la génération, et
        modifier une recette ensuite ne réécrit pas une liste déjà emportée au
        marché.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromDate, toDate]
              properties:
                name:
                  description: À défaut, un intitulé est déduit de la période.
                  type: string
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
                cookbookId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingList' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Aucun repas planifié sur cette période }
  /shopping-lists/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [ShoppingLists]
      summary: Détail (items agrégés, triés par nom d'ingrédient)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [ShoppingLists]
      summary: Supprimer la liste (EDITOR+ si cookbook)
      responses:
        '204': { description: Supprimé }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shopping-lists/{id}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [ShoppingLists]
      summary: Cocher / modifier un item (EDITOR+ si cookbook)
      description: >
        Seule la ligne modifiée est rendue : cocher un article n'en change aucun
        autre, et renvoyer une liste de courses entière à chaque case cochée serait
        du gaspillage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                checked: { type: boolean }
                quantity: { type: number, nullable: true }
                unit: { type: string, nullable: true }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ShoppingListItem' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------- Catalog -----------------------------
  /ingredients:
    get:
      tags: [Catalog]
      summary: Recherche d'ingrédients (autocomplétion)
      description: >
        Recherche par fragment, quelle que soit sa position dans le nom : « olive »
        retrouve « huile d'olive ». Les noms qui commencent par la saisie passent
        devant. Le catalogue est global et alimenté au fil des recettes créées ;
        il n'est cloisonné par aucun utilisateur, sans quoi l'autocomplétion serait
        vide sur un compte neuf. Sans `q`, rend le début du catalogue par ordre
        alphabétique.
      parameters:
        - in: query
          name: q
          description: Fragment recherché. La casse est ignorée, les jokers LIKE neutralisés.
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: limit
          description: Nombre maximal de propositions.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Ingredient' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tags:
    get:
      tags: [Catalog]
      summary: Lister les tags
      description: >
        Vocabulaire partagé, groupé par type puis par ordre alphabétique. Les
        tags de type `course` (entrée, plat, dessert...) sont posés par la
        migration initiale ; les tags `custom` naissent des recettes, en saisie
        libre. **Le périmètre dépend de l'appelant** : un visiteur anonyme ne
        reçoit que les tags portés par au moins une recette `public`, un
        utilisateur authentifié reçoit le vocabulaire entier — un tag écrit sur
        une recette privée serait sinon publié avec la liste.
      security: []
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [cuisine, diet, difficulty, course, custom] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ----------------------------- Import / Export -----------------------------
  /export:
    get:
      tags: [ImportExport]
      summary: Exporter ses recettes et cookbooks (données en clair)
      description: >
        Périmètre de lecture de l'utilisateur : ses recettes et celles des cookbooks
        dont il est membre. Le fichier est renvoyé en pièce jointe.
        L'avertissement sur les données en clair figure dans le champ `warning`
        de l'export JSON et en tête du fichier CSV.
      parameters:
        - in: query
          name: format
          description: Natif (json), tableur (csv) ou schéma Mealie (mealie).
          schema: { type: string, enum: [json, csv, mealie], default: json }
      responses:
        '200':
          description: Fichier d'export
          headers:
            Content-Disposition:
              description: 'attachment; filename="supmeal-export-AAAA-MM-JJ.<ext>"'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportFile' }
            text/csv:
              schema: { type: string }
  /import:
    post:
      tags: [ImportExport]
      summary: Importer un fichier (importeur = créateur)
      description: >
        L'importeur devient créateur des recettes importées, qui sont créées privées
        quelle que soit la visibilité d'origine. Une recette dont le titre est déjà
        possédé est ignorée (`skipped`), ce qui rend l'import idempotent ; une recette
        invalide est consignée dans `errors` sans interrompre les suivantes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                format:
                  description: Déduit du contenu du fichier s'il est omis.
                  type: string
                  enum: [json, csv, mealie]
      responses:
        '200':
          description: Rapport d'import
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [json, csv, mealie] }
                  created: { type: integer }
                  skipped: { type: integer }
                  errors: { type: array, items: { type: string } }
        '400': { description: Fichier absent ou type non accepté }
        '422': { description: "Fichier mal formé, vide ou de plus de 500 recettes" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Provider:
      in: path
      name: provider
      required: true
      schema: { type: string, enum: [google, github] }
    Page:
      in: query
      name: page
      schema: { type: integer, default: 1, minimum: 1, maximum: 10000 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

  responses:
    Unauthorized:
      description: Non authentifié
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rôle ou permission insuffisant
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Ressource introuvable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Données invalides
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflit (doublon)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
    Role:
      type: string
      enum: [READER, COMMENTER, EDITOR, OWNER]
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    OAuthAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google, github] }
        createdAt: { type: string, format: date-time }
    UserPreferences:
      type: object
      properties:
        diets: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        preferredCuisines: { type: array, items: { type: string } }
        defaultServings: { type: integer }
    Ingredient:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    RecipeIngredient:
      type: object
      properties:
        ingredientId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: number }
        unit: { type: string }
        note: { type: string, nullable: true }
        position: { type: integer }
    RecipeStep:
      type: object
      properties:
        position: { type: integer }
        instruction: { type: string }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [cuisine, diet, difficulty, course, custom] }
    Recipe:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        prepTimeMin: { type: integer }
        cookTimeMin: { type: integer }
        servings: { type: integer }
        imageUrl: { type: string, nullable: true }
        source: { type: string, nullable: true }
        visibility: { type: string, enum: [private, public] }
        avgRating: { type: number, nullable: true }
        reviewCount: { type: integer }
        ingredients: { type: array, items: { $ref: '#/components/schemas/RecipeIngredient' } }
        steps: { type: array, items: { $ref: '#/components/schemas/RecipeStep' } }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        isFavorite: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecipePage:
      description: >
        Page de résultats de recherche, quel qu'en soit le périmètre. Les entrées
        sont des résumés : tags compris, ingrédients et étapes exclus.
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Recipe' } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    RecipeInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        prepTimeMin: { type: integer }
        cookTimeMin: { type: integer }
        servings: { type: integer }
        source: { type: string }
        visibility: { type: string, enum: [private, public], default: private }
        ingredients:
          type: array
          items:
            type: object
            required: [name]
            description: >
              `quantity` est facultative : « sel », « poivre » ou « quelques
              feuilles de basilic » n'en ont pas, et l'imposer forcerait une
              valeur mensongère. Le nom est normalisé (minuscules, espaces
              réduits) pour mutualiser les ingrédients entre recettes.
            properties:
              name: { type: string }
              quantity: { type: number, nullable: true }
              unit: { type: string, nullable: true }
              note: { type: string, nullable: true }
        steps:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
    Cookbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        myRole: { $ref: '#/components/schemas/Role' }
        memberCount: { type: integer }
        recipeCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Membership:
      type: object
      properties:
        id: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/Role' }
        joinedAt: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        invitedEmail: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [pending, accepted, declined] }
        createdAt: { type: string, format: date-time }
    CreatedInvitation:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          properties:
            token: { type: string, description: "Token en clair, transmis une seule fois" }
            acceptUrl: { type: string, description: Lien d'acceptation à transmettre à l'invité }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        cookbookId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/User' }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/User' }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 2000, nullable: true }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        cookbookId: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/User' }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    MealPlanEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipe: { $ref: '#/components/schemas/Recipe' }
        cookbookId:
          type: string
          format: uuid
          nullable: true
          description: null pour un planning personnel, sinon le cookbook du planning partagé
        author:
          allOf: [ { $ref: '#/components/schemas/User' } ]
          description: Membre qui a inscrit le repas
        date: { type: string, format: date }
        mealType: { type: string, enum: [petit-déjeuner, déjeuner, dîner, collation] }
        servings: { type: integer, nullable: true }
    MealPlanEntryInput:
      type: object
      required: [recipeId, date, mealType]
      properties:
        recipeId: { type: string, format: uuid }
        cookbookId: { type: string, format: uuid, nullable: true }
        date: { type: string, format: date }
        mealType: { type: string, enum: [petit-déjeuner, déjeuner, dîner, collation] }
        servings: { type: integer, nullable: true }
    MealPlanEntryUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Au moins un champ. `cookbookId` en est volontairement absent.
      properties:
        recipeId: { type: string, format: uuid }
        date: { type: string, format: date }
        mealType: { type: string, enum: [petit-déjeuner, déjeuner, dîner, collation] }
        servings: { type: integer, nullable: true }
    ShoppingList:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cookbookId: { type: string, format: uuid, nullable: true }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/ShoppingListItem' } }
        createdAt: { type: string, format: date-time }
    ShoppingListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        ingredient: { $ref: '#/components/schemas/Ingredient' }
        quantity: { type: number }
        unit: { type: string }
        checked: { type: boolean }
    ExportedRecipe:
      description: >
        Recette telle qu'elle figure dans un fichier d'export natif. Forme volontairement
        distincte de Recipe : un fichier d'export est un contrat durable, il ne doit pas
        changer parce que la réponse HTTP a gagné un champ. La visibilité n'y figure pas,
        toute recette importée étant créée privée.
      type: object
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        prepTimeMin: { type: integer, nullable: true }
        cookTimeMin: { type: integer, nullable: true }
        servings: { type: integer, nullable: true }
        source: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        ingredients:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: number, nullable: true }
              unit: { type: string, nullable: true }
              note: { type: string, nullable: true }
        steps: { type: array, items: { type: string } }
    PersonalDataFile:
      description: >
        Données personnelles, pour la portabilité. Chaque collection ne porte que
        ce que l'utilisateur a produit lui-même.
      type: object
      properties:
        exportedAt: { type: string, format: date-time }
        warning: { type: string }
        profile:
          type: object
          properties:
            email: { type: string, format: email }
            displayName: { type: string }
            avatarUrl: { type: string, nullable: true }
            hasPassword:
              description: Existence d'un mot de passe local ; sa valeur ne sort jamais.
              type: boolean
            createdAt: { type: string, format: date-time }
        preferences: { $ref: '#/components/schemas/UserPreferences' }
        oauthAccounts:
          type: array
          items:
            type: object
            properties:
              provider: { type: string, enum: [google, github, microsoft] }
              providerUserId: { type: string }
              linkedAt: { type: string, format: date-time }
        cookbookMemberships:
          type: array
          items:
            type: object
            properties:
              cookbook: { type: string, nullable: true }
              role: { $ref: '#/components/schemas/Role' }
              joinedAt: { type: string, format: date-time }
        recipes:
          type: object
          properties:
            note:
              description: Renvoi vers `/export`, seul à produire les recettes en entier.
              type: string
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  visibility: { type: string, enum: [private, public] }
                  createdAt: { type: string, format: date-time }
        favorites:
          type: array
          items:
            type: object
            properties:
              recipe: { type: string, nullable: true }
              addedAt: { type: string, format: date-time }
        reviews:
          type: array
          items:
            type: object
            properties:
              recipe: { type: string, nullable: true }
              rating: { type: integer }
              body: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        comments:
          type: array
          items:
            type: object
            properties:
              cookbook: { type: string, nullable: true }
              recipe: { type: string, nullable: true }
              content: { type: string }
              createdAt: { type: string, format: date-time }
        messages:
          type: array
          items:
            type: object
            properties:
              cookbook: { type: string, nullable: true }
              content: { type: string }
              createdAt: { type: string, format: date-time }
        mealPlan:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              mealType: { type: string }
              recipe: { type: string, nullable: true }
              servings: { type: integer, nullable: true }
              cookbook: { type: string, nullable: true }
        shoppingLists:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              cookbook: { type: string, nullable: true }
              fromDate: { type: string, format: date, nullable: true }
              toDate: { type: string, format: date, nullable: true }
              createdAt: { type: string, format: date-time }
              items:
                type: array
                items:
                  type: object
                  properties:
                    ingredient: { type: string, nullable: true }
                    quantity: { type: number, nullable: true }
                    unit: { type: string, nullable: true }
                    checked: { type: boolean }
    ExportFile:
      description: Fichier d'export au format natif SUPMEAL.
      type: object
      properties:
        format: { type: string, enum: [supmeal] }
        version: { type: integer }
        warning:
          description: Avertissement sur l'absence de chiffrement du fichier.
          type: string
        exportedAt: { type: string, format: date-time }
        cookbooks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string, nullable: true }
              recipeTitles: { type: array, items: { type: string } }
        recipes: { type: array, items: { $ref: '#/components/schemas/ExportedRecipe' } }
